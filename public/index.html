<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TILT SMASH</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #111;
        }

        #tank {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            display: block;
        }

        #overlay {
            position: fixed;
            inset: 0;
            z-index: 10;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: system-ui;
        }

        #overlay.hidden {
            display: none;
        }

        #url {
            color: #7df;
            word-break: break-all;
            display: block;
            margin-bottom: 16px;
            font-size: 14px;
            text-align: center;
        }

        #qr img {
            display: block;
            width: 200px;
            height: 200px;
        }

        #qr {
            margin: 20px 0;
        }

        #logo {
            font-family: "Press Start 2P", monospace;
            font-size: 6rem;
            color: #4a9;
            text-shadow: 4px 4px 0 #2d7;
            margin-bottom: 30px;
            letter-spacing: 4px;
        }

        #status {
            font-size: 16px;
            margin-bottom: 12px;
            color: #aaa;
        }

        #countdown {
            position: fixed;
            inset: 0;
            z-index: 20;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            font-family: system-ui;
        }

        #countdown.show {
            display: flex;
        }

        #countdown-number {
            font-size: 200px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <canvas id="tank"></canvas>

    <div id="overlay">
        <div id="logo">TILT SMASH</div>
        <div id="status">Scan to connect your phone:</div>
        <div id="qr"></div>
    </div>

    <div id="countdown">
        <div id="countdown-number">3</div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/simple-peer/9.11.1/simplepeer.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"
        integrity="sha512-ZDSPMa/JM1D+7kdg2x3BsruQ6T/JpJo3jWDWkCZsP+5yVyp1KfESqLI+7RqB5k24F7p2cV7i2YHh/890y6P6Sw=="
        crossorigin="anonymous"></script>
    <script src="./desktop.js"></script>
</body>

</html>
