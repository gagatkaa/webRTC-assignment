<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Controller</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: grid;
            place-items: center;
            font-family: system-ui;
            background: #111;
            color: white;
            text-align: center;
        }

        #status {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 16px;
        }

        button {
            font-size: 18px;
            padding: 12px 16px;
        }

        #debug {
            position: fixed;
            left: 12px;
            right: 12px;
            bottom: 12px;
            max-height: 30vh;
            overflow: auto;
            font-size: 12px;
            text-align: left;
            padding: 10px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.55);
            color: #d7d7d7;
        }

        /* Joystick fallback */
        #joystick {
            display: none;
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.25);
            align-items: center;
            justify-content: center;
            touch-action: none;
        }

        #knob {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>

<body>
    <div>
        <div id="status">Press the button, then tilt your phone.</div>
        <button id="enable">Enable Motion</button>
    </div>

    <div id="joystick">
        <div id="knob"></div>
    </div>
    <div id="debug"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="./controller.js"></script>
</body>

</html>
